# reTerminal E1001 ePaper dashboard firmware
#
#.  Used the following resources to understand the hardware and ESPHome support
#   https://wiki.seeedstudio.com/reterminal_e10xx_with_esphome/
#   https://wiki.seeedstudio.com/reterminal_e10xx_with_esphome_advanced/
#
# Hardware:
#   - 7.5" monochrome ePaper, 800x480, Ultrachip UC8179 controller (waveshare 7.50inv2)
#   - ESP32-S3R8 (8 MB octal PSRAM)
#   - Onboard Sensirion SHT4x temp/humidity on I²C (SDA=GPIO19, SCL=GPIO20)
#   - Battery sense on GPIO1 (requires GPIO21 enable, divider ratio 2.0)
#   - 3 buttons: GPIO3 (green), GPIO4 (right white), GPIO5 (left white)
#   - LED on GPIO6, buzzer on GPIO45
#
# Strategy: device wakes, reads onboard sensors, pushes them as URL params
# to our HA add-on, fetches the rendered 1-bit BMP, displays, deep-sleeps.
# Buttons wake the device and allow for browsing between multiple dashboard pages

substitutions:
  device_name: doordash
  friendly_name: "Door Dashboard"
  firmware_version: "0.2.0"
  dashboard_host: "homeassistant.local:8099"
  refresh_interval: "15min"
  # Development toggle: keep the device awake & refresh on a timer instead of
  # the deep-sleep wake cycle. Set to "0" for battery operation; set to "1"
  # for active development. Must be 1 or 0 — used as C preprocessor literal.
  #
  # OTA workflow when dev_mode=0:
  #   1. Press any button (GPIO4) — device wakes and stays awake.
  #   2. `esphome run firmware/reterminal-dashboard.yaml` — pushes new firmware.
  #   3. Device reboots into new firmware, runs one refresh, sleeps again.
  dev_mode: "0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: gertjana.reterminal_dashboard
    version: ${firmware_version}
  on_boot:
    # Earliest hardware init: LED on so we can see the device is awake
    # the instant power/wake hits, before any other component starts.
    - priority: 700
      then:
        - output.turn_on: status_led
    # Early hardware init: enable battery sense rail before anything else,
    # and (in dev mode) prevent deep sleep BEFORE Wi-Fi/refresh/sleep can
    # race us. Doing this at priority -100 is too late: on_connect kicks
    # off refresh_dashboard, which sleeps from on_download_finished, all
    # before the late-boot lambda gets a chance to run.
    - priority: 600
      then:
        - output.turn_on: bsp_battery_enable
        - lambda: |-
            // Substitutions are textual: "${dev_mode}" becomes literally
            // "1" or "0" in the source. Use a runtime string compare so we
            // don't depend on the C preprocessor parsing it correctly.
            const char* dm = "${dev_mode}";
            ESP_LOGW("boot", "dev_mode substitution = '%s'", dm);
            if (dm[0] == '1') {
              ESP_LOGW("boot", "DEV MODE — deep sleep disabled, staying awake");
              id(deep_sleeper).prevent_deep_sleep();
            }
    # Late boot: now that all components are constructed, handle the
    # wake-from-sleep case (production-mode only). In dev mode this is a
    # no-op because we already called prevent_deep_sleep() above.
    #
    # ext1 wake on any of GPIO3/4/5: figure out which button(s) caused
    # the wake and adjust current_page BEFORE on_connect's refresh
    # builds the URL. Bitmask from esp_sleep_get_ext1_wakeup_status().
    #   GPIO3 (green) → page 0 (home)
    #   GPIO4 (right) → next page
    #   GPIO5 (left)  → previous page
    # current_page is restored from NVS so prev/next operate on the
    # page that was showing when the device went to sleep.
    #
    # We also chirp the buzzer here on any button wake, so the user
    # gets immediate audible feedback that the press registered —
    # useful because the display takes several seconds to refresh.
    - priority: -100
      then:
        - lambda: |-
            const char* dm = "${dev_mode}";
            if (dm[0] == '1') return;
            esp_sleep_wakeup_cause_t cause = esp_sleep_get_wakeup_cause();
            if (cause != ESP_SLEEP_WAKEUP_EXT1) {
              ESP_LOGI("boot", "Normal wake (cause=%d) — refresh cycle", (int) cause);
              return;
            }
            uint64_t mask = esp_sleep_get_ext1_wakeup_status();
            ESP_LOGW("boot", "ext1 wake, pin mask=0x%llx, last page=%d",
                     (unsigned long long) mask, id(current_page));
            int n = id(page_count);
            if (n < 1) n = 1;
            // Green takes precedence if multiple pins read low simultaneously
            // (e.g. user holding green while another bounces).
            if (mask & (1ULL << 3)) {
              id(current_page) = 0;
              ESP_LOGW("boot", "wake=green → page 0");
            } else if (mask & (1ULL << 4)) {
              id(current_page) = (id(current_page) + 1) % n;
              ESP_LOGW("boot", "wake=right → page %d", id(current_page));
            } else if (mask & (1ULL << 5)) {
              id(current_page) = (id(current_page) - 1 + n) % n;
              ESP_LOGW("boot", "wake=left → page %d", id(current_page));
            }
        # Wake chirp + lockout. We chirp once on the wake-causing press,
        # then set button_locked = true so the binary_sensor on_press
        # handler (which fires for the same physical press while the GPIO
        # is still held) is suppressed and any rapid follow-up presses
        # during this awake cycle are ignored. RAM is wiped at deep sleep
        # so the lock naturally clears for the next wake.
        - if:
            condition:
              lambda: |-
                const char* dm = "${dev_mode}";
                return dm[0] != '1' &&
                       esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT1;
            then:
              - script.execute: chirp
              - lambda: 'id(button_locked) = true;'

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    # Per-device key — kept in HA's secrets.yaml, NEVER in this repo.
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  ap:
    ssid: "Doordash-Setup"
    password: "doordash-setup"
  on_connect:
    then:
      - logger.log: "Wi-Fi connected — priming sensors"
      - component.update: indoor_sht4x
      # Battery rail needs ~100ms to stabilise after GPIO21 turns on; we
      # already turned it on in on_boot priority 600, but give the ADC
      # input cap time to settle then take a fresh reading.
      - delay: 500ms
      - component.update: battery_voltage
      - delay: 1500ms
      - component.update: battery_pct
      # Learn page count from the server before we start any refresh, so
      # the button handlers know how far they're allowed to wrap.
      - script.execute: fetch_page_count
      - script.execute:
          id: refresh_dashboard
          nocache: false

captive_portal:

# Page navigation state.
#
# `current_page` is the dashboard page the device should request next
# (?page=N). With `restore_value: true` it survives deep sleep via NVS,
# so a wake from a white button can advance/retreat from the last-shown
# page and a wake from green resets to 0 (handled in the late-boot
# lambda based on which ext1 pin caused the wake).
#
# `page_count` is the number of pages the server currently serves. We
# learn it on boot by GETting /pages, with a sensible default so we
# don't get stuck if the server is unreachable. No need to persist —
# we refresh it every boot.
globals:
  - id: current_page
    type: int
    restore_value: true
    initial_value: '0'
  - id: page_count
    type: int
    # Persist across deep sleep / reboot in NVS. mDNS resolution of the
    # dashboard host can take several seconds after wake, so the on-connect
    # `fetch_page_count` often fails on cold boot; by persisting the last
    # known-good value we avoid being stuck on the initial default after
    # the addon grows or shrinks its page list.
    restore_value: true
    initial_value: '4'
  - id: button_locked
    # Set to true on the first button press of an awake cycle. Subsequent
    # presses are ignored until deep sleep clears RAM. Eliminates the
    # buzzer-stuck-ON race that happens when a press lands during the
    # pre-sleep silence window or while a chirp is mid-flight.
    type: bool
    restore_value: false
    initial_value: 'false'

# Refresh script: build the URL from current sensor values, then fetch.
# Called on Wi-Fi connect and (in dev mode) on a periodic interval.
script:
  # Short audible "button received" beep.
  # GPIO45 drives a passive piezo via an LEDC PWM output at 2.7 kHz
  # (near the resonance peak of typical small piezos). 50% duty produces
  # a clean square-wave tone; 0% silences it.
  - id: chirp
    # `queued` rather than `restart`: each press should produce its own
    # distinct click.
    # `queued` lets each invocation complete its on→delay→off cycle.
    mode: queued
    then:
      - output.set_level:
          id: buzzer
          # Duty cycle controls perceived loudness on a passive piezo:
          # 0.5 (50% — peak transitions) is the loudest possible drive,
          # 0.1 (10%) is markedly quieter while keeping the click crisp.
          # Drop to ~0.05 for whisper-quiet; lower than that loses the
          # tonal character and starts to sound like clicks of static.
          level: 0.1
      - delay: 40ms
      - output.set_level:
          id: buzzer
          level: 0.0

  - id: refresh_dashboard
    # `restart` (rather than `single`): if a refresh is already in flight
    # — e.g. the on-connect boot refresh hasn't finished when the user
    # mashes a button — the new invocation cancels the old one and wins.

    mode: restart
    # `nocache=true` tells the server to skip its image cache. We use it
    # for the green-button "force fresh" action; routine refreshes go
    # without it so the cache can serve identical wakes cheaply.
    parameters:
      nocache: bool
    then:
      - logger.log: "Building dashboard URL with sensor values"
      - lambda: |-
          char buf[320];
          float t = id(indoor_temp).state;
          float h = id(indoor_hum).state;
          float b = id(battery_pct).state;
          int p = id(current_page);
          int n = snprintf(buf, sizeof(buf),
                           "http://${dashboard_host}/dashboard.bmp?fw=${firmware_version}&page=%d&", p);
          if (nocache)  n += snprintf(buf + n, sizeof(buf) - n, "nocache=1&");
          if (!isnan(t)) n += snprintf(buf + n, sizeof(buf) - n, "indoor_temp=%.1f&", t);
          if (!isnan(h)) n += snprintf(buf + n, sizeof(buf) - n, "indoor_hum=%.1f&", h);
          if (!isnan(b)) n += snprintf(buf + n, sizeof(buf) - n, "battery_pct=%.0f&", b);
          ESP_LOGI("dashboard", "URL: %s", buf);
          id(dashboard_img).set_url(std::string(buf));
      - component.update: dashboard_img

  # Learn the number of dashboard pages from the server's /pages endpoint.
  # Called once on Wi-Fi connect; if it fails we keep the initial_value
  # default (3) and carry on.
  - id: fetch_page_count
    mode: single
    then:
      - http_request.get:
          url: "http://${dashboard_host}/pages"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  // Tiny ad-hoc JSON parse: look for `"count":N` in the body.
                  // Avoids dragging in a full JSON dep just for one integer.
                  std::string s(body);
                  auto pos = s.find("\"count\"");
                  if (pos == std::string::npos) {
                    ESP_LOGW("pages", "no 'count' key in /pages response");
                    return;
                  }
                  pos = s.find(':', pos);
                  if (pos == std::string::npos) return;
                  int n = atoi(s.c_str() + pos + 1);
                  if (n > 0 && n < 64) {
                    id(page_count) = n;
                    ESP_LOGI("pages", "page_count = %d", n);
                  } else {
                    ESP_LOGW("pages", "implausible count=%d, ignoring", n);
                  }
          on_error:
            then:
              - logger.log:
                  level: WARN
                  format: "fetch_page_count: HTTP error, keeping default"

# Dev-mode periodic refresh. In normal (deep-sleep) operation this fires
# once per wake cycle and is harmless; in dev mode it's how we keep the
# display updating without ever sleeping.
interval:
  - interval: ${refresh_interval}
    then:
      - component.update: indoor_sht4x
      - delay: 500ms
      - component.update: battery_voltage
      - delay: 1500ms
      - component.update: battery_pct
      - script.execute:
          id: refresh_dashboard
          nocache: false

# Deep sleep loop: wake -> fetch image -> render -> sleep.
#
# Wake sources: any of the 3 buttons (GPIO3/4/5) via ext1, plus the
# periodic timer. ext1 with mode ANY_LOW wakes when any pin in the
# mask reads LOW — buttons are active-low (pulled-up, short to GND
# when pressed). The late-boot lambda above reads the wake bitmask
# and adjusts current_page accordingly:
#   GPIO3 (green) → home (page 0)
#   GPIO4 (right) → next page
#   GPIO5 (left)  → previous page
#
# All three pins are also claimed by their `binary_sensor:` entries
# below, so both schemas need `allow_other_uses: true`. As a side-effect
# the binary_sensors switch from interrupt to polling mode (fine for
# human button presses).
#
# NOTE on RTC pull-ups: ESP-IDF's ext1 driver by default keeps internal
# pull resistors active during deep sleep when the
# ESP_SLEEP_GPIO_ENABLE_INTERNAL_RESISTORS Kconfig is set (default on
# Arduino-ESP32). If wake turns out to be flaky we may need to call
# rtc_gpio_pullup_en() / rtc_gpio_hold_en() manually before sleep.
deep_sleep:
  id: deep_sleeper
  run_duration: 45s
  sleep_duration: ${refresh_interval}
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        allow_other_uses: true
        mode:
          input: true
          pullup: true
        inverted: true
      - number: GPIO4
        allow_other_uses: true
        mode:
          input: true
          pullup: true
        inverted: true
      - number: GPIO5
        allow_other_uses: true
        mode:
          input: true
          pullup: true
        inverted: true
    mode: ANY_LOW

http_request:
  verify_ssl: false
  timeout: 20s
  watchdog_timeout: 25s

# Download the BMP from the HA add-on with current sensor values as query
# parameters. Renderer caches on the (rounded) values so identical wakes
# are served from cache.
online_image:
  - id: dashboard_img
    url: "http://${dashboard_host}/dashboard.bmp"
    format: BMP
    type: BINARY
    update_interval: never
    on_download_finished:
      then:
        - logger.log: "Image downloaded — refreshing display"
        - component.update: epaper
        - delay: 3s
        # In dev mode (${dev_mode} == "1") stay awake so we can test
        # buttons / OTA. Otherwise: turn LED off and sleep.
        - lambda: |-
            const char* dm = "${dev_mode}";
            ESP_LOGW("sleep", "on_download_finished dev_mode='%s'", dm);
            if (dm[0] != '1') {
              id(status_led).turn_off();
            }
        # Drain any queued/in-flight chirp by giving it >40ms to complete,
        # then explicitly silence the buzzer. If we sleep mid-chirp the
        # LEDC peripheral state can get frozen at 50% duty → continuous
        # tone until the supercap drains. Belt-and-braces:
        #  1. wait 80ms (>2× chirp length) so any active chirp finishes.
        #  2. force buzzer level to 0 (multiple times across delays so a
        #     late-arriving chirp can't outrun us).
        - delay: 80ms
        - output.set_level: { id: buzzer, level: 0.0 }
        - delay: 30ms
        - output.set_level: { id: buzzer, level: 0.0 }
        # Unlock buttons just before sleeping. In production mode this is
        # cosmetic (RAM is about to be wiped anyway), but in dev mode the
        # device stays awake — without this clear, button_locked would
        # latch forever after the first press.
        - lambda: 'id(button_locked) = false;'
        - lambda: |-
            const char* dm = "${dev_mode}";
            if (dm[0] != '1') {
              id(deep_sleeper).begin_sleep(true);
            } else {
              ESP_LOGW("sleep", "DEV MODE — skipping deep sleep");
            }
    on_error:
      then:
        - logger.log: "Image download failed — sleeping anyway"
        - delay: 1s
        - lambda: |-
            const char* dm = "${dev_mode}";
            if (dm[0] != '1') {
              id(status_led).turn_off();
            }
        - delay: 80ms
        - output.set_level: { id: buzzer, level: 0.0 }
        - delay: 30ms
        - output.set_level: { id: buzzer, level: 0.0 }
        - lambda: 'id(button_locked) = false;'
        - lambda: |-
            const char* dm = "${dev_mode}";
            if (dm[0] != '1') {
              id(deep_sleeper).begin_sleep(true);
            } else {
              ESP_LOGW("sleep", "DEV MODE — skipping deep sleep (after error)");
            }

# === SPI bus for the ePaper (verified pins) ===
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# === DISPLAY ===
display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    rotation: 0
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard_img));

# === I²C (onboard SHT4x) — verified pins ===
i2c:
  sda: GPIO19
  scl: GPIO20
  frequency: 100kHz

# === Time from Home Assistant ===
time:
  - platform: homeassistant
    id: ha_time

# === Outputs ===
output:
  # Battery sense enable — MUST be on to read GPIO1 ADC.
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  # Onboard status LED (GPIO6). Solid on = device awake; off = sleeping.
  # If the LED is actually active-low on this board, add `inverted: true`.
  - platform: gpio
    pin: GPIO6
    id: status_led

  # Onboard buzzer (GPIO45). Passive piezo — must be driven with a PWM
  # tone, not a static GPIO level, otherwise it makes no sound and (on
  # some boards) the plain-gpio init can fault at boot.
  - platform: ledc
    pin: GPIO45
    id: buzzer
    frequency: 2700Hz

# === Buttons ===
# Diagnostic stage: just log presses and chirp on each one so we can confirm
# the wiring matches Seeed's documented pin map before binding real actions.
# Assumes the buttons short the GPIO to GND when pressed (the common pattern
# on this board); if the log shows a press as soon as the device boots, flip
# `inverted:` to false for that button.
binary_sensor:
  - platform: gpio
    id: button_green
    name: "Button Green"
    pin:
      number: GPIO3
      # Shared with deep_sleep.esp32_ext1_wakeup pin list — both sides
      # need this flag or ESPHome aborts with "pin used in multiple places".
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(button_locked);'
            then:
              - logger.log:
                  level: WARN
                  format: "BUTTON: green ignored (locked until sleep)"
            else:
              - lambda: 'id(button_locked) = true;'
              - logger.log:
                  level: WARN
                  format: "BUTTON: green (GPIO3) → home + force refresh"
              - script.execute: chirp
              - lambda: |-
                  id(current_page) = 0;
              - script.execute:
                  id: refresh_dashboard
                  nocache: true

  - platform: gpio
    id: button_right
    name: "Button Right White"
    pin:
      number: GPIO4
      # Shared with deep_sleep.esp32_ext1_wakeup pin list — both sides
      # need this flag or ESPHome aborts with "pin used in multiple places".
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(button_locked);'
            then:
              - logger.log:
                  level: WARN
                  format: "BUTTON: right ignored (locked until sleep)"
            else:
              - lambda: 'id(button_locked) = true;'
              - logger.log:
                  level: WARN
                  format: "BUTTON: right white (GPIO4) → next page"
              - script.execute: chirp
              # Re-fetch page count first so we self-heal from any stale value
              # (e.g. on-connect fetch raced with the first refresh, or the addon
              # has grown/shrunk its page list since the device last connected).
              - script.execute: fetch_page_count
              - lambda: |-
                  int n = id(page_count);
                  if (n < 1) n = 1;
                  id(current_page) = (id(current_page) + 1) % n;
                  ESP_LOGW("page", "current_page = %d / %d", id(current_page), n);
              - script.execute:
                  id: refresh_dashboard
                  nocache: false

  - platform: gpio
    id: button_left
    name: "Button Left White"
    pin:
      number: GPIO5
      # Shared with deep_sleep.esp32_ext1_wakeup pin list — both sides
      # need this flag or ESPHome aborts with "pin used in multiple places".
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(button_locked);'
            then:
              - logger.log:
                  level: WARN
                  format: "BUTTON: left ignored (locked until sleep)"
            else:
              - lambda: 'id(button_locked) = true;'
              - logger.log:
                  level: WARN
                  format: "BUTTON: left white (GPIO5) → previous page"
              - script.execute: chirp
              # See right-button handler for rationale; same self-heal trick.
              - script.execute: fetch_page_count
              - lambda: |-
                  int n = id(page_count);
                  if (n < 1) n = 1;
                  id(current_page) = (id(current_page) - 1 + n) % n;
                  ESP_LOGW("page", "current_page = %d / %d", id(current_page), n);
              - script.execute:
                  id: refresh_dashboard
                  nocache: false

# === Sensors ===
sensor:
  # Onboard temperature + humidity
  - platform: sht4x
    id: indoor_sht4x
    temperature:
      id: indoor_temp
      name: "Indoor Temperature"
    humidity:
      id: indoor_hum
      name: "Indoor Humidity"
    update_interval: 15min

  # Battery voltage via onboard divider (GPIO1, divider ratio 2.0).
  # Filters smooth out the noisy ADC and reject obvious bad reads
  # (e.g. 0V when the rail hasn't stabilised yet).
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0
      # Drop implausibly low readings (rail still settling or disabled).
      - lambda: |-
          if (x < 2.5f) return {};
          return x;
      # Smooth out single-sample ADC noise.
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1

  # Derived battery percentage using Seeed's calibration curve.
  - platform: template
    id: battery_pct
    name: "Battery Percentage"
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
