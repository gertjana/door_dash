# DSMR P1 reader firmware
#
# Hardware: ESP8266 on a "DSMR-Logger" / "DSMR-API" PCB by Willem Aandewiel
# (mrwheel). Reference ESPHome config:
# https://github.com/mrWheel/DSMRloggerAPI/blob/master/EspHome.yaml
#
# Slimme meter: Landis+Gyr E350 (ZCF110CCtFs2), SMR 5.0 protocol.
# 115200 8N1, ASCII telegrams pushed by the meter ~once per second.

substitutions:
  device_name: dsmr-reader
  friendly_name: "DSMR P1 Reader"
  firmware_version: "0.1.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: gertjana.dsmr_reader
    version: ${firmware_version}

esp8266:
  board: d1_mini
  framework:
    version: recommended

logger:
  # Free up the hardware UART; logs go over the Native API to HA / esphome cli.
  baud_rate: 0
  level: DEBUG

api:
  encryption:
    key: !secret dsmr_api_encryption_key

ota:
  - platform: esphome
    password: !secret dsmr_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "DSMR Reader Fallback"
    password: "configme123"

captive_portal:

# P1 data on GPIO13
uart:
  id: uart_p1
  rx_pin: GPIO13
  baud_rate: 115200
  rx_buffer_size: 1700

# RTS / data-request line on GPIO12. Pulse high for 500 ms every 30 s to
# request a fresh telegram. Some meters/PCB combinations need this; SMR 5.0
# meters generally push autonomously
output:
  - platform: gpio
    pin: GPIO12
    id: p1_request

interval:
  - interval: 30s
    then:
      - output.turn_on: p1_request
      - delay: 500ms
      - output.turn_off: p1_request

dsmr:
  id: dsmr_instance
  uart_id: uart_p1
  max_telegram_length: 1700
  crc_check: true

sensor:
  - platform: dsmr
    energy_delivered_tariff1:
      name: "Energy Delivered (Tariff 1 / low)"
      state_class: total_increasing
    energy_delivered_tariff2:
      name: "Energy Delivered (Tariff 2 / high)"
      state_class: total_increasing
    energy_returned_tariff1:
      name: "Energy Returned (Tariff 1 / low)"
      state_class: total_increasing
    energy_returned_tariff2:
      name: "Energy Returned (Tariff 2 / high)"
      state_class: total_increasing
    power_delivered:
      name: "Power Delivered"
    power_returned:
      name: "Power Returned"
    voltage_l1:
      name: "Voltage L1"
    voltage_l2:
      name: "Voltage L2"
    voltage_l3:
      name: "Voltage L3"
    current_l1:
      name: "Current L1"
    current_l2:
      name: "Current L2"
    current_l3:
      name: "Current L3"
    power_delivered_l1:
      name: "Power Delivered L1"
    power_delivered_l2:
      name: "Power Delivered L2"
    power_delivered_l3:
      name: "Power Delivered L3"
    power_returned_l1:
      name: "Power Returned L1"
    power_returned_l2:
      name: "Power Returned L2"
    power_returned_l3:
      name: "Power Returned L3"
    gas_delivered:
      name: "Gas Delivered"
      state_class: total_increasing

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: dsmr
    identification:
      name: "DSMR Identification"
    p1_version:
      name: "DSMR Version"
