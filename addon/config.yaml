name: ePaper Dashboard
version: "1.2.2"
slug: epaper_dashboard
description: Renders an 800x480 1-bit dashboard image for the reTerminal E1001
url: https://github.com/gertjana/door_dash
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
homeassistant_api: true
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": Dashboard image endpoint (LAN)

options:
  wifi_ssid: "<Your Wi-Fi SSID>"
  wifi_password: "<Your Wi-Fi password>"
  wifi_security: "WPA"
  wifi_hidden: false
  weather_entity: "weather.home"
  calendar_entities:
    - "calendar.personal"
  max_events: 8
  timezone: "Europe/Amsterdam"
  refresh_cache_seconds: 60
  show_local_sensors: true
  show_tesla: true
  tesla_battery_entity: ""
  tesla_range_entity: ""
  tesla_inside_temp_entity: ""
  tesla_climate_entity: ""
  # Energy page (defaults match Zuidwijk SlimmeLezer firmware).
  # Single-phase, consumption-only — solar production and L2/L3 are
  # intentionally not modelled here.
  energy_power_consumed_l1_entity: "sensor.power_consumed_phase_1"
  energy_voltage_l1_entity: "sensor.voltage_phase_1"
  energy_current_l1_entity: "sensor.current_phase_1"
  energy_tariff1_entity: "sensor.energy_consumed_tariff_1"
  energy_tariff2_entity: "sensor.energy_consumed_tariff_2"
  energy_gas_entity: "sensor.gas_consumed"
  indoor_temp_entity: "sensor.door_dashboard_indoor_temperature"
  indoor_humidity_entity: "sensor.door_dashboard_indoor_humidity"

schema:
  wifi_ssid: str
  wifi_password: password
  wifi_security: list(WPA|WEP|nopass)
  wifi_hidden: bool
  weather_entity: str
  calendar_entities:
    - str
  max_events: int(1,20)
  timezone: str
  refresh_cache_seconds: int(10,3600)
  show_local_sensors: bool
  show_tesla: bool
  tesla_battery_entity: str?
  tesla_range_entity: str?
  tesla_inside_temp_entity: str?
  tesla_climate_entity: str?
  energy_power_produced_l1_entity: str?
  energy_power_produced_l2_entity: str?
  energy_power_produced_l3_entity: str?
  energy_power_consumed_l1_entity: str?
  energy_power_consumed_l2_entity: str?
  energy_power_consumed_l3_entity: str?
  energy_voltage_l1_entity: str?
  energy_voltage_l2_entity: str?
  energy_voltage_l3_entity: str?
  energy_current_l1_entity: str?
  energy_current_l2_entity: str?
  energy_current_l3_entity: str?
  energy_tariff1_entity: str?
  energy_tariff2_entity: str?
  energy_gas_entity: str?
  indoor_temp_entity: str?
  indoor_humidity_entity: str?
